name: iOS-App bauen
on:
  push:
    branches: [ios-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Umgebung
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -80
